<section class="max-w-4xl mx-auto py-8">
  <div class="mb-6">
    <a routerLink="/" class="text-sm font-medium text-emerald-400 hover:text-emerald-300 inline-flex items-center gap-1.5 transition-colors">
      &larr; Volver al catálogo
    </a>
  </div>

  @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-400"></div>
    </div>
  }

  @if (errorMessage()) {
    <div class="bg-rose-950/50 border border-rose-500/50 text-rose-200 p-6 rounded-2xl text-center">
      <p class="font-semibold">{{ errorMessage() }}</p>
      <a routerLink="/" class="text-xs text-rose-300 underline mt-2 inline-block">Regresar al listado</a>
    </div>
  }

  @if (challenge(); as item) {
    <article class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl">
      <header class="border-b border-slate-800 pb-6 mb-6">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-xs px-3 py-1 rounded-md font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
            {{ item.difficulty }}
          </span>
          <span class="text-xs px-3 py-1 rounded-md text-slate-400 bg-slate-800">
            {{ item.category }}
          </span>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-100">
          {{ item.title }}
        </h1>
        <p class="text-xs text-slate-500 font-mono mt-1">Identificador: {{ item.slug }}</p>
      </header>

      <!-- Requisitos del reto -->
      <div class="prose prose-invert max-w-none text-slate-300 whitespace-pre-line leading-relaxed">
        {{ item.descriptionMd }}
      </div>
    </article>
  }
</section>
