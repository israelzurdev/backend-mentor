spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5432/backendmentor_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

